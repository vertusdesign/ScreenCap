name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app
      - name: Build
        run: swift build
      - name: Self-test
        run: .build/debug/ScreenCap --selftest "$RUNNER_TEMP/selftest"
      - name: Universal build
        run: swift build -c release --arch arm64 --arch x86_64
