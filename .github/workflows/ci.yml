name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # No Xcode pin: the runner's default toolchain is a supported one, and a
      # hard-coded path breaks whenever the image drops that exact version.
      - name: Toolchain
        run: swift --version && xcodebuild -version

      - name: Build
        run: make debug BUILD_FLAVOR=base 2>&1 | tee build.log

      - name: Self-test
        run: SCREENCAP_STRINGS=Resources/l10n .build/base/debug/ScreenCap --selftest "$RUNNER_TEMP/selftest"

      # English is the source catalog. Other locales may intentionally omit a
      # new key while it is being translated; L10n.t falls back to English.
      # Extra/typo keys are still rejected so they cannot silently go unused.
      - name: Check translations are complete
        run: |
          python3 - <<'EOF'
          import json, pathlib, re, sys
          keys = set(re.findall(r'^"([^"]+)" = ', pathlib.Path("Resources/l10n/en.lproj/Localizable.strings").read_text(encoding="utf-8"), re.M))
          bad = False
          for f in sorted(pathlib.Path("Resources/l10n").glob("*.lproj/Localizable.strings")):
              present = set(re.findall(r'^"([^"]+)" = ', f.read_text(encoding="utf-8"), re.M))
              extra = present - keys
              if extra:
                  bad = True
                  print(f"{f.parent.name}: extra {sorted(extra)}")
          sys.exit(1 if bad else 0)
          EOF

      - name: Universal build
        run: make universal BUILD_FLAVOR=base
