name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # No Xcode pin: the runner's default toolchain is a supported one, and a
      # hard-coded path breaks whenever the image drops that exact version.
      - name: Toolchain
        run: swift --version && xcodebuild -version

      - name: Self-test
        run: |
          swift build
          SCREENCAP_STRINGS=Resources/l10n .build/debug/ScreenCap --selftest "$RUNNER_TEMP/selftest"

      # Stable tags such as v1.0.0 keep VERSION numeric and CHANNEL empty. A prerelease
      # suffix such as -beta still maps to CHANNEL for future preview builds.
      - name: Derive version
        id: version
        run: |
          FULL="${GITHUB_REF_NAME#v}"
          VERSION="${FULL%%-*}"
          CHANNEL=""
          if [ "$FULL" != "$VERSION" ]; then CHANNEL="${FULL#*-}"; fi
          {
            echo "full=$FULL"
            echo "version=$VERSION"
            echo "channel=$CHANNEL"
            echo "prerelease=$([ -n "$CHANNEL" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - name: Build disk image
        run: |
          make dmg \
            VERSION="${{ steps.version.outputs.version }}" \
            CHANNEL="${{ steps.version.outputs.channel }}" \
            BUILD="${{ github.run_number }}"

      - name: Verify universal binary
        run: lipo -archs dist/ScreenCap.app/Contents/MacOS/ScreenCap | tee /dev/stderr | grep -q x86_64

      - name: Verify the app reports the tagged version
        run: |
          PLIST=dist/ScreenCap.app/Contents/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$PLIST")" \
             = "${{ steps.version.outputs.version }}"
          test "$(/usr/libexec/PlistBuddy -c 'Print SCVersionChannel' "$PLIST")" \
             = "${{ steps.version.outputs.channel }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenCap-dmg
          path: |
            dist/*.dmg
            dist/*.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ScreenCap ${{ steps.version.outputs.full }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: |
            dist/*.dmg
            dist/*.sha256
          # Notes live in the repository so a re-run of this workflow reproduces the
          # release text exactly instead of overwriting it with something shorter.
          body_path: .github/RELEASE_NOTES.md
