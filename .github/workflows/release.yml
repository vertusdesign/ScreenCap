name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Self-test
        run: |
          swift build
          .build/debug/ScreenCap --selftest "$RUNNER_TEMP/selftest"

      - name: Derive version
        id: version
        run: |
          REF="${GITHUB_REF_NAME}"
          echo "value=${REF#v}" >> "$GITHUB_OUTPUT"

      - name: Build disk image
        run: make dmg VERSION="${{ steps.version.outputs.value }}" BUILD="${{ github.run_number }}"

      - name: Verify universal binary
        run: lipo -archs dist/ScreenCap.app/Contents/MacOS/ScreenCap | tee /dev/stderr | grep -q x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenCap-dmg
          path: dist/*.dmg

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          body: |
            Собрано из тега ${{ github.ref_name }}.

            Приложение подписано ad-hoc: при первом запуске правый клик → «Открыть».
